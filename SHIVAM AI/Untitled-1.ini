Step 1: Start
Step 2: Display the conversion menu:
 1. Celsius to Fahrenheit
 2. Celsius to Kelvin
 3. Fahrenheit to Celsius
 4. Fahrenheit to Kelvin
 5. Kelvin to Celsius
 6. Kelvin to Fahrenheit
Step 3: Read the user’s choice (option number).
Step 4: Ask the user to enter the temperature value.
Step 5: Read the temperature value.
Step 6: Use a selection structure to perform the correct conversion:
• If choice = 1:
 F = (C × 9/5) + 32
• If choice = 2:
 K = C + 273.15
• If choice = 3:
 C = (F − 32) × 5/9
• If choice = 4:
 K = (F − 32) × 5/9 + 273.15
• If choice = 5:
 C = K − 273.15
• If choice = 6:
 F = (K − 273.15) × 9/5 + 32
Else:
 Display “Invalid choice”.
Step 7: Display the result of the conversion.
Step 8: Stop.